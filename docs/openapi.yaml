openapi: 3.1.0
info:
  title: StockAlert API
  version: 1.0.0
  description: REST API for managing a user's retail inventory, categories, and stock movements.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Health
    description: Check API availability and database connectivity.
  - name: Authentication
    description: Register accounts and authenticate users with JWTs.
  - name: Categories
    description: Create and manage inventory categories.
  - name: Products
    description: Create and manage products in the authenticated user's inventory.
  - name: Stock movements
    description: Record stock changes and retrieve product movement history.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getApiHealth
      tags: [Health]
      security: []
      summary: Check API health
      responses:
        "200":
          description: API is running successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message, timestamp]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "StockAlert API is running."
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-10-23T10:00:00.000Z"

  /health/db:
    get:
      operationId: getDatabaseHealth
      tags: [Health]
      security: []
      summary: Check database connection
      responses:
        "200":
          description: Database connection successful
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Database connection successful."
        "503":
          description: Database connection unavailable
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Database connection unavailable."

  /auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      security: []
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        "201":
          description: Account created
        "400":
          description: Invalid input
        "409":
          description: Email already registered
        "500":
          description: Unexpected server or database error

  /auth/login:
    post:
      operationId: loginUser
      tags: [Authentication]
      security: []
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Login successful
        "400":
          description: Invalid input
        "401":
          description: Invalid credentials
        "500":
          description: Unexpected server or database error

  /categories:
    get:
      operationId: getCategories
      tags: [Categories]
      summary: List the authenticated user's categories
      responses:
        "200":
          description: Category list
        "401":
          description: Authentication required
        "500":
          description: Unexpected server or database error
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: [string, "null"]
      responses:
        "201":
          description: Category created
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "409":
          description: A category with this name already exists for the authenticated user
        "500":
          description: Unexpected server or database error

  /categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      operationId: getCategoryById
      tags: [Categories]
      summary: Get one category owned by the authenticated user
      responses:
        "200":
          description: Category details
        "400":
          description: Invalid category UUID
        "401":
          description: Authentication required
        "404":
          description: Category not found or not owned by the authenticated user
        "500":
          description: Unexpected server or database error
    patch:
      operationId: updateCategory
      tags: [Categories]
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: [string, "null"]
              minProperties: 1
      responses:
        "200":
          description: Category updated successfully
        "400":
          description: Invalid UUID or request body
        "401":
          description: Authentication required
        "404":
          description: Category not found or not owned by the authenticated user
        "409":
          description: A category with this name already exists for the authenticated user
        "500":
          description: Unexpected server or database error
    delete:
      operationId: deleteCategory
      tags: [Categories]
      summary: Delete a category; associated products become uncategorized
      responses:
        "200":
          description: Category deleted successfully
        "400":
          description: Invalid category UUID
        "401":
          description: Authentication required
        "404":
          description: Category not found or not owned by the authenticated user
        "500":
          description: Unexpected server or database error

  /products:
    get:
      operationId: getProducts
      tags: [Products]
      summary: List the authenticated user's products
      parameters:
        - in: query
          name: categoryId
          description: Filter products by a category ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product list
        "400":
          description: Invalid category UUID
        "401":
          description: Authentication required
        "500":
          description: Unexpected server or database error
    post:
      operationId: createProduct
      tags: [Products]
      summary: Create a product; initial quantity is zero, and stock is added through stock movements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Product created
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "404":
          description: Category not found or not owned by the authenticated user
        "409":
          description: Duplicate SKU for this user
        "500":
          description: Unexpected server or database error

  /products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getProductById
      tags: [Products]
      summary: Get one product owned by the authenticated user
      responses:
        "200":
          description: Product details
        "400":
          description: Invalid product UUID
        "401":
          description: Authentication required
        "404":
          description: Product not found or not owned by the authenticated user
        "500":
          description: Unexpected server or database error
    patch:
      operationId: updateProduct
      tags: [Products]
      summary: Update product metadata; quantity is changed only through stock movements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
        "400":
          description: Invalid product UUID or request body
        "401":
          description: Authentication required
        "404":
          description: Product or category not found or not owned by the authenticated user
        "409":
          description: Duplicate SKU for this user
        "500":
          description: Unexpected server or database error
    delete:
      operationId: deleteProduct
      tags: [Products]
      summary: Delete a product and its movement history
      responses:
        "200":
          description: Product deleted successfully
        "400":
          description: Invalid product UUID
        "401":
          description: Authentication required
        "404":
          description: Product not found or not owned by the authenticated user
        "500":
          description: Unexpected server or database error

  /products/{productId}/stock-movements:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      operationId: getStockMovements
      tags: [Stock movements]
      summary: List a product's stock movement history, newest first
      responses:
        "200":
          description: Movement history
        "400":
          description: Invalid product UUID
        "401":
          description: Authentication required
        "404":
          description: Product not found or not owned by the authenticated user
        "500":
          description: Unexpected server or database error
    post:
      operationId: recordStockMovement
      tags: [Stock movements]
      summary: Record stock-in or stock-out transactionally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementCreate"
      responses:
        "201":
          description: Movement recorded; includes the movement and resulting stock quantity
        "400":
          description: Invalid product UUID or movement input
        "401":
          description: Authentication required
        "404":
          description: Product not found or not owned by the authenticated user
        "409":
          description: Insufficient stock for the requested stock-out operation
        "500":
          description: Unexpected server or database error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ProductCreate:
      type: object
      additionalProperties: false
      required: [name, sku]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        sku:
          type: string
          minLength: 1
          maxLength: 100
        minimumStockLevel:
          type: integer
          minimum: 0
          default: 5
        unitPrice:
          type: [number, "null"]
          minimum: 0
          multipleOf: 0.01
        categoryId:
          type: string
          format: uuid

    ProductUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        sku:
          type: string
          minLength: 1
          maxLength: 100
        minimumStockLevel:
          type: integer
          minimum: 0
        unitPrice:
          type: [number, "null"]
          minimum: 0
          multipleOf: 0.01
        categoryId:
          type: [string, "null"]
          format: uuid

    StockMovementCreate:
      type: object
      additionalProperties: false
      required: [type, quantity]
      properties:
        type:
          type: string
          enum: [STOCK_IN, STOCK_OUT]
        quantity:
          type: integer
          minimum: 1
        note:
          type: [string, "null"]
          maxLength: 500
